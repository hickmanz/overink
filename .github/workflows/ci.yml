name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OverInk.slnx -c Release

      - name: Test
        run: dotnet test OverInk.slnx -c Release --no-build

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/OverInk.Mac
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Protocol and format checks
        run: swift run -c release OverInkCoreChecks
